name: Randare video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID-ul jobului din tabelul render_jobs"
        required: true
      project_id:
        description: "ID-ul proiectului"
        required: true
      quality:
        description: "hd (1080p) sau draft (540p)"
        required: false
        default: "hd"

concurrency:
  group: render-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Biblioteci de sistem pentru Chrome
        run: |
          sudo apt-get update
          LIBS="libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-noto-core"
          sudo apt-get install -y $LIBS libasound2t64 || sudo apt-get install -y $LIBS libasound2

      - name: Instalez dependențele
        run: npm ci

      - name: Descarc browserul pentru randare
        run: npx remotion browser ensure

      - name: Randez videoul
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ inputs.project_id }}
          JOB_ID: ${{ inputs.job_id }}
          QUALITY: ${{ inputs.quality }}
        run: npm run render

      - name: Marchez jobul ca eșuat (dacă s-a oprit pe drum)
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/render_jobs?id=eq.$JOB_ID&status=in.(queued,running)" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Randarea s-a oprit neașteptat în GitHub Actions. Verifică jurnalul rulării."}' || true
